<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="MD File Viewer">
  <title>MD File Viewer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow-indigo" cx="0.12" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="0.98" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <linearGradient id="fade-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="dots-fade">
      <rect x="720" y="0" width="560" height="320" fill="url(#fade-grad)"/>
    </mask>

    <linearGradient id="md-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C7CEB"/>
      <stop offset="1" stop-color="#4169E1"/>
    </linearGradient>
    <linearGradient id="md-hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.27"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="md-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow-indigo)"/>
  <rect width="1280" height="320" fill="url(#glow-blue)"/>
  <rect x="720" y="0" width="560" height="320" fill="url(#dots)" mask="url(#dots-fade)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <g transform="translate(72 78) scale(0.165)">
    <rect x="56.3" y="56.3" width="911.4" height="911.4" rx="230.4" fill="url(#md-bg)"/>
    <rect x="56.3" y="56.3" width="911.4" height="911.4" rx="230.4" fill="url(#md-hl)"/>
    <g fill="#FFFFFF" fill-rule="evenodd" filter="url(#md-shadow)">
      <path d="M157.0 614.4C157.0 604.0 160.7 595.3 168.1 588.3C175.5 581.3 185.0 577.8 196.7 577.8C208.2 577.8 217.6 581.3 225.0 588.3C232.4 595.3 236.1 604.0 236.1 614.4C236.1 624.6 232.4 633.1 225.0 639.9C217.6 646.8 208.2 650.3 196.7 650.3C185.0 650.3 175.5 646.8 168.1 639.9C160.7 633.1 157.0 624.6 157.0 614.4Z" fill-opacity="0.62"/>
      <path d="M579.2 373.7L579.2 647.1L512.6 647.1L512.6 483.2L451.4 647.1L397.7 647.1L336.2 482.8L336.2 647.1L269.6 647.1L269.6 373.7L348.2 373.7L425.0 563.0L500.9 373.7ZM867.0 510.4C867.0 537.2 861.1 560.9 849.3 581.7C837.5 602.5 820.7 618.6 799.0 630.0C777.4 641.4 752.2 647.1 723.7 647.1L621.2 647.1L621.2 373.7L723.7 373.7C752.5 373.7 777.7 379.5 799.2 390.9C820.8 402.3 837.5 418.3 849.3 439.0C861.1 459.6 867.0 483.4 867.0 510.4ZM799.2 510.4C799.2 485.3 792.2 465.7 778.2 451.6C764.2 437.6 744.6 430.6 719.4 430.6L687.8 430.6L687.8 589.5L719.4 589.5C744.6 589.5 764.2 582.6 778.2 568.9C792.2 555.1 799.2 535.6 799.2 510.4Z"/>
    </g>
  </g>

  <text x="288" y="150" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff">MD File Viewer</text>
  <text x="290" y="198" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="27" font-weight="400" fill="#9aa4b2">GitHub-style Markdown preview &amp; WYSIWYG editing in VS Code.</text>
  <rect x="290" y="230" width="380" height="6" rx="3" fill="url(#accent)"/>
</svg>
